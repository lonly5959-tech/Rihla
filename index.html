/* رحلة — visual system.
   Direction: the children's-learning-app standard, built to the craft level of Duolingo and Apple's own apps.
   Chunky pressable controls with a lip that sinks on press; Apple large titles, grouped cards and a translucent tab bar;
   bright saturated colour, one hue per section; real photographs carry the content. */
:root{
  color-scheme:light;
  --bg:#F3F5F9; --surface:#FFFFFF; --surface2:#F7F9FC; --fill:#EDF0F5; --ink:#1C2333; --muted:#5B6577; --line:#E4E8EF; --lip:#D3D9E3;
  --brand:#2465D0; --brand-lip:#1A4DA3; --brand-ink:#1559C4; --brand-soft:#E5F0FF; --brand-soft-lip:#C9DCFA; --sel:#84B4F5; --on-brand:#FFFFFF;
  --sun:#FFC21A; --sun-lip:#E0A100; --sun-soft:#FFF4D6; --sun-line:#FFE08A; --sun-ink:#8F5A00; --on-sun:#2B2000;
  --good:#1E8546; --good-lip:#14663A; --good-soft:#E3F7EA; --good-line:#8FD9AA; --good-ink:#0F7436;
  --warn:#A34D00; --warn-soft:#FFEEDD;
  --bad:#C9343A; --bad-lip:#9E2329; --bad-soft:#FFE7E7; --bad-soft-lip:#F6C6C8; --bad-ink:#B42D33;
  --grape:#6A3FD0; --tang:#B85600; --sea:#0B6F6D;
  --shadow:0 1px 2px rgba(22,34,58,.05),0 6px 18px rgba(22,34,58,.06);
  --lift:0 10px 28px rgba(22,34,58,.14);
  --display:"Baloo Bhaijaan 2",-apple-system,"SF Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Arabic","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --r:22px; --r-md:16px; --r-sm:12px;
  --press:transform .09s cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E131D; --surface:#182030; --surface2:#1D2637; --fill:#232D3F; --ink:#EEF2F8; --muted:#9AA6B8; --line:#2A3446; --lip:#0A0F17;
    --brand:#2465D0; --brand-lip:#163F86; --brand-ink:#6AA8FF; --brand-soft:#1D3557; --brand-soft-lip:#122440; --sel:#3C6DB8; --on-brand:#FFFFFF;
    --sun:#FFC21A; --sun-lip:#B98700; --sun-soft:#3D3217; --sun-line:#6B5520; --sun-ink:#FFC861; --on-sun:#2B2000;
    --good:#1E8546; --good-lip:#105C30; --good-soft:#173A2A; --good-line:#2E7A4C; --good-ink:#4FD283;
    --warn:#FFB547; --warn-soft:#3F2E15;
    --bad:#C9343A; --bad-lip:#8A1F25; --bad-soft:#40222A; --bad-soft-lip:#2A141A; --bad-ink:#FF8A8F;
    --grape:#B18CFF; --tang:#FFB547; --sea:#3FD1CB;
    --shadow:0 0 0 1px var(--line); --lift:0 10px 30px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E131D; --surface:#182030; --surface2:#1D2637; --fill:#232D3F; --ink:#EEF2F8; --muted:#9AA6B8; --line:#2A3446; --lip:#0A0F17;
  --brand:#2465D0; --brand-lip:#163F86; --brand-ink:#6AA8FF; --brand-soft:#1D3557; --brand-soft-lip:#122440; --sel:#3C6DB8; --on-brand:#FFFFFF;
  --sun:#FFC21A; --sun-lip:#B98700; --sun-soft:#3D3217; --sun-line:#6B5520; --sun-ink:#FFC861; --on-sun:#2B2000;
  --good:#1E8546; --good-lip:#105C30; --good-soft:#173A2A; --good-line:#2E7A4C; --good-ink:#4FD283;
  --warn:#FFB547; --warn-soft:#3F2E15;
  --bad:#C9343A; --bad-lip:#8A1F25; --bad-soft:#40222A; --bad-soft-lip:#2A141A; --bad-ink:#FF8A8F;
  --grape:#B18CFF; --tang:#FFB547; --sea:#3FD1CB;
  --shadow:0 0 0 1px var(--line); --lift:0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;caret-color:var(--brand-ink)}
::selection{background:var(--brand-soft);color:var(--ink)}
*{scrollbar-width:thin;scrollbar-color:var(--lip) transparent}
::-webkit-scrollbar{width:8px;height:8px} ::-webkit-scrollbar-thumb{background:var(--lip);border-radius:8px} ::-webkit-scrollbar-track{background:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible,input:focus-visible,label.btn:focus-within,a:focus-visible{outline:3px solid var(--brand-ink);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.25;text-wrap:balance}
h1{font-size:30px;font-weight:800} h2{font-size:20px;font-weight:700} h3{font-size:17px;font-weight:700}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.i{width:1.3em;height:1.3em;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.28em}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 16px 32px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:10px}
.row.top{align-items:flex-start}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.col{display:flex;flex-direction:column;gap:8px}
.muted{color:var(--muted);font-size:14px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 11px;font-size:13px;font-weight:600;background:var(--brand-soft);color:var(--brand-ink);white-space:nowrap}
.chip .i{width:15px;height:15px;vertical-align:0}
.chip.good{background:var(--good-soft);color:var(--good-ink)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad-ink)} .chip.plain{background:var(--fill);color:var(--muted)}

/* chunky pressable controls: the lip is a bottom border that disappears as the face sinks */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:8px 20px;border-radius:var(--r-md);background:var(--brand);background-clip:padding-box;border-bottom:4px solid var(--brand-lip);color:var(--on-brand);font-weight:700;text-align:center;line-height:1.3;transition:var(--press)}
.btn:active{transform:translateY(3px);border-bottom-color:transparent}
.btn .i{width:20px;height:20px;vertical-align:0}
.btn.ghost{background:var(--brand-soft);border-bottom-color:var(--brand-soft-lip);color:var(--brand-ink)}
.btn.line{background:var(--surface);border:2px solid var(--line);border-bottom:4px solid var(--lip);color:var(--ink)}
.btn.line:active{border-bottom-color:var(--line)}
.btn.danger{background:var(--bad-soft);border-bottom-color:var(--bad-soft-lip);color:var(--bad-ink)}
.btn.small{min-height:40px;padding:5px 14px;font-size:14px;border-radius:var(--r-sm);border-bottom-width:3px}
.btn.small .i{width:17px;height:17px}
label.btn{position:relative;overflow:hidden;cursor:pointer}
label.btn input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.iconbtn{width:46px;height:46px;border-radius:14px;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;color:var(--ink);display:grid;place-items:center;flex:none;transition:var(--press)}
.iconbtn:active{transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.iconbtn .i{width:22px;height:22px}
.iconbtn.holding{outline:4px solid var(--sun);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pill{min-height:44px;padding:6px 16px;border-radius:999px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);font-weight:700;color:var(--ink);transition:var(--press)}
.pill:active{transform:translateY(2px)}
.pill[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--sel);color:var(--brand-ink)}

/* bottom tabs, iOS style: translucent bar, tinted active icon, one hue per section */
nav.tabs{display:flex;flex-wrap:wrap;background:color-mix(in srgb,var(--surface) 84%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));position:relative;z-index:5}
nav.tabs button{flex:1 0 0;min-width:0;position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 1px 3px;border-radius:12px;font-size:11.5px;white-space:nowrap;color:var(--muted);font-weight:600;--acc:var(--brand-ink)}
nav.tabs button[hidden]{display:none}
nav.tabs .tb{position:absolute;top:1px;inset-inline-start:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font:700 10.5px/17px var(--body);font-style:normal;text-align:center;box-shadow:0 0 0 2px var(--surface)}
nav.tabs.many{row-gap:2px}
nav.tabs.many button{flex:1 0 20%;font-size:11px;line-height:1.3;gap:2px;padding:4px 1px 2px}
nav.tabs.many button svg{width:23px;height:23px}
@media (min-width:640px){nav.tabs.many button{flex:1 0 0;font-size:11.5px;gap:3px;padding:5px 1px 3px}nav.tabs.many button svg{width:26px;height:26px}}
/* on phones the bar has two rows: lift what floats above it */
@media (max-width:639.9px){body.tabs2 .fab{bottom:calc(126px + env(safe-area-inset-bottom,0px))}body.tabs2 .toast{bottom:calc(132px + env(safe-area-inset-bottom,0px))}}
nav.tabs button svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:transform .18s cubic-bezier(.2,.8,.2,1)}
nav.tabs button[data-tab="today"]{--acc:var(--tang)} nav.tabs button[data-tab="sounds"]{--acc:var(--brand-ink)} nav.tabs button[data-tab="board"]{--acc:var(--good-ink)}
nav.tabs button[data-tab="games"]{--acc:var(--grape)} nav.tabs button[data-tab="org"]{--acc:var(--bad-ink)} nav.tabs button[data-tab="progress"]{--acc:var(--sea)}
nav.tabs button[aria-current="page"]{color:var(--acc)}
nav.tabs button[aria-current="page"] svg{fill:color-mix(in srgb,currentColor 18%,transparent);stroke-width:2.2;transform:translateY(-1px) scale(1.06)}

/* pictures: photographs fill their frame */
.pc{display:grid;place-items:center;max-width:100%}
.ph{display:block;object-fit:cover;background:var(--fill)}
.sw{display:block;width:44px;height:44px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}

/* today */
.card.voice{background:var(--sun-soft);box-shadow:inset 0 0 0 2px var(--sun-line)}
.mic{width:50px;height:50px;border-radius:50%;background:var(--sun);color:var(--on-sun);display:grid;place-items:center;flex:none;border-bottom:3px solid var(--sun-lip)}
.mic .i{width:26px;height:26px}
.rwd{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;-webkit-overflow-scrolling:touch}
.rw{flex:none;width:86px;border-radius:var(--r-md);border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);padding:6px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;font-weight:700;line-height:1.3;transition:var(--press)}
.rw:active{transform:translateY(2px)}
.rw[aria-pressed="true"]{border-color:var(--sun);background:var(--sun-soft)}
.rw .pc{width:100%;height:auto;min-height:44px} .rw .e{font-size:30px;line-height:1.3} .rw .ph{width:100%;height:auto;aspect-ratio:1;border-radius:11px} .rw .sw{width:32px;height:32px} .rw .big{font-size:13px}
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-md);background:var(--surface2);border:2px solid var(--line);border-bottom-width:4px;text-align:start;width:100%;transition:var(--press)}
.step:active{transform:translateY(2px)}
.step .n{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);font-family:var(--display);font-weight:800;flex:none}
.step .n .i{width:20px;height:20px}
.step.done{background:var(--good-soft);border-color:var(--good-line)}
.step.done .n{background:var(--good);border-color:var(--good);color:var(--on-brand)}
.step .tx{flex:1;min-width:0} .step .tx b{display:block;font-weight:700} .step .tx span{font-size:13px;color:var(--muted);display:block}
.step .go{color:var(--brand-ink);font-weight:700;font-size:14px;flex:none}
.counters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.counter{border-radius:var(--r-md);padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.counter.g{background:var(--good-soft);color:var(--good-ink)} .counter.w{background:var(--warn-soft);color:var(--warn)} .counter.b{background:var(--bad-soft);color:var(--bad-ink)}
.counter .v{font-family:var(--display);font-size:32px;font-weight:800;line-height:1}
.counter .l{font-size:13px;font-weight:600;line-height:1.3;min-height:34px;display:flex;align-items:center;color:var(--ink)}
.counter .pm{display:flex;gap:6px}
.counter .pm button{width:42px;height:38px;border-radius:11px;background:var(--surface);font-size:20px;font-weight:800;border:2px solid var(--line);border-bottom-width:4px;color:var(--ink);transition:var(--press)}
.counter .pm button:active{transform:translateY(2px)}
.toggle{flex:1;min-height:48px;border-radius:var(--r-md);border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);font-weight:600;padding:6px 12px;color:var(--ink);transition:var(--press)}
.toggle:active{transform:translateY(2px)}
.toggle .i{width:18px;height:18px}
.toggle[aria-pressed="true"]{background:var(--good-soft);border-color:var(--good-line);color:var(--good-ink)}
textarea{width:100%;min-height:80px;border-radius:var(--r-sm);border:2px solid transparent;background:var(--fill);color:var(--ink);font:inherit;padding:10px 12px;resize:vertical}
textarea:focus{border-color:var(--brand);outline:none;background:var(--surface)}
.tip{background:var(--sun-soft);border-radius:var(--r-md);padding:12px 14px;font-size:15px}
.tip b{font-family:var(--display)}

/* sounds */
.ladder{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ladder button{border-radius:14px;padding:8px 2px 6px;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;display:flex;flex-direction:column;align-items:center;gap:1px;transition:var(--press)}
.ladder button:active{transform:translateY(2px)}
.ladder button b{font-family:var(--display);font-size:15px;font-weight:800}
.ladder button span{font-size:12px;color:var(--muted)}
.ladder button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);border-bottom-color:var(--brand-lip);color:var(--on-brand)}
.ladder button[aria-pressed="true"] span{color:var(--on-brand)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid.two{grid-template-columns:repeat(2,1fr)}
.tile{position:relative;background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:20px;padding:7px 7px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;min-height:104px;justify-content:center;overflow-wrap:anywhere;color:var(--ink);transition:var(--press)}
.tile:active{transform:translateY(3px);border-bottom-width:2px;margin-bottom:3px}
.tile .pc{width:100%;min-height:46px}
.tile .e{font-size:40px;line-height:1.15}
.tile .ph{width:100%;height:auto;aspect-ratio:1;border-radius:14px}

var GAMEBY={};GAMES.forEach(function(g){GAMEBY[g.id]=g;});
function gamePrompts(gid,light){
  var g=GAMEBY[gid];if(!g)return [];
  if(g.kind==='pick')return light?['w_where']:g.pool().map(function(i){return 'q_'+i.id;});
  if(g.kind==='fn')return C.fn.filter(function(f){return ITEMS[f.ans]&&!ITEMS[f.ans].hide;}).map(function(f){return f.id;});
  return {size:['q_big','q_small'],len:['q_long','q_short'],pos:['q_up','q_down'],odd:['q_odd']}[g.kind]||[];
}
function rank(it){var s=stat(it.id).status;return s==='need'?0:s==='prog'?1:s==='new'?2:3;}
function pickN(pool,n,dn){var a=rot(pool,dn).filter(function(i){return rank(i)<3;}).sort(function(x,y){return rank(x)-rank(y);});if(a.length<n)a=a.concat(rot(pool,dn).filter(function(i){return a.indexOf(i)<0;}));return a.slice(0,n);}
function makePlan(){
  var dn=dayNum(today());
  var warm=pickN(grp('vowels').concat(grp('fun')),2,dn).concat(pickN(grp('syll'),2,dn*2));
  var words=pickN(grp('req').concat(FUNC),3,dn).concat(pickN(grp('obj').concat(grp('act'),grp('body'),grp('colors'),grp('people')),2,dn*3));
  if(S.set.bmi){var mast=grp('req').concat(FUNC,grp('obj'),grp('act'),grp('body'),grp('colors')).filter(function(i){return stat(i.id).status==='mast'&&words.indexOf(i)<0;});words=rot(mast,dn).slice(0,2).concat(words);}
  var m2=grp('two').filter(function(i){return stat(i.id).status==='mast';}).length;
  var phr=m2>=4?pickN(grp('three'),3,dn):pickN(grp('two'),3,dn);
  var g=GAMES[dn%GAMES.length];
  return [{id:'warm',name:'تسخين الأصوات',items:warm},{id:'words',name:'كلمات اليوم',items:words},{id:'phr',name:m2>=4?'جملة الطلب':'كلمتان للطلب',items:phr},{id:'game',name:'لعبة: '+g.name,game:g.id}]
    .filter(function(s){return s.game||s.items.length;});
}
function plan(){
  var d=today(),pc=S.plan,ok=true,steps;
  if(pc&&pc.d===d&&pc.steps){
    steps=pc.steps.map(function(s){var o={id:s.id,name:s.name};
      if(s.game){if(!GAMEBY[s.game])ok=false;else{o.game=s.game;o.sub=GAMEBY[s.game].sub;}}
      else{o.items=(s.ids||[]).map(function(i){return ITEMS[i];}).filter(function(i){return i&&!i.hide;});if(!o.items.length)ok=false;o.sub=o.items.map(function(i){return i.t;}).join('، ');}
      return o;});
    if(ok)return steps;
  }
  steps=makePlan();
  S.plan={d:d,steps:steps.map(function(s){return s.game?{id:s.id,name:s.name,game:s.game}:{id:s.id,name:s.name,ids:s.items.map(function(i){return i.id;})};})};saveLocal();
  steps.forEach(function(s){s.sub=s.game?GAMEBY[s.game].sub:s.items.map(function(i){return i.t;}).join('، ');});
  return steps;
}
function todayNeeds(){
  var ids=[];
  plan().forEach(function(s){(s.items||[]).forEach(function(it){ids=ids.concat(needFor(it.id));});if(s.game)gamePrompts(s.game,true).forEach(function(p){ids=ids.concat(needFor(p));});});
  ['fb_1','fb_2'].forEach(function(x){if(!hasA(x))ids.push(x);});
  ids=uniq(ids);
  return ids.filter(function(x){return !!XCLIPS[x];}).concat(ids.filter(function(x){return !XCLIPS[x];}));
}
function allClips(){
  var ids=['w_want','w_where'];
  ['req','func'].forEach(function(g){grp(g).forEach(function(i){ids.push(i.id);});});
  ids=ids.concat(PRAISE);
  LEVELS.forEach(function(L){L.groups.forEach(function(g){g.items.forEach(function(it){if(!it.hide)ids.push(it.id);});});});
  GAMES.forEach(function(g){ids=ids.concat(gamePrompts(g.id));});
  grp('rewards').forEach(function(i){ids.push(i.id);});
  return uniq(ids);
}

function weekStats(){
  var from=addDays(today(),-6),dates={},sp=[0,0,0,0],c={spont:0,asked:0,pull:0},gr=0,gw=0,notes=[],who={};
  Object.keys(S.days).forEach(function(k){var x=S.days[k];if(!x||!x.date||x.date<from||x.date>today())return;var t=x.t||{},n=0;
    Object.keys(t).forEach(function(id){var a=t[id];if(id.indexOf('g:')===0){gr+=a[0]||0;gw+=a[1]||0;n+=sum(a);}else{for(var i=0;i<4;i++)sp[i]+=a[i]||0;n+=sum(a);}});
    ['spont','asked','pull'].forEach(function(q){c[q]+=(x.c&&x.c[q])||0;});
    if(n||(x.s||[]).length)dates[x.date]=1;
    if(n){var w=WHO[x.who]||'غير محدد';who[w]=(who[w]||0)+n;}
    if(x.n)notes.push([x.date,x.n,WHO[x.who]||'']);});
  notes.sort(function(a,b){return a[0]<b[0]?1:-1;});

/* step-by-step sequence of one activity */
function actSteps(a){return (a.steps&&a.steps.length)?a.steps:[{id:a.id,t:a.t,e:a.e,min:a.min}];}
function openSteps(actId,itemId){var a=libGet('act',actId);if(!a)return;var D={type:'steps',actId:actId,itemId:itemId||null,i:0,marks:[],done:false,draw:drawSteps};openOv(D);enterStep(D);}
function enterStep(D){var a=libGet('act',D.actId);if(!a)return;var s=actSteps(a)[D.i];if(!s)return;
  if(S.set.autoTimer!==false&&s.min)tmStart('st:'+D.actId+':'+D.i,s.min);else if(S.tm&&S.tm.key.indexOf('st:')===0)S.tm=null;saveLocal();
  D.draw();setTimeout(function(){if(TOP()===D)say(s.id);},200);}
function drawSteps(){
  var D=this,a=libGet('act',D.actId);if(!a){closeOv();return;}var ss=actSteps(a),n=ss.length;
  if(D.done){layer.innerHTML='<div class="overlay" role="dialog" aria-label="انتهى النشاط"><header><span class="ttl">'+esc(a.t)+'</span></header><div class="stage"><div class="inner end"><p class="eyebrow">خلّصت <svg class="i" aria-hidden="true"><use href="#i-check"/></svg></p><div class="pic">'+picHTML(a)+'</div><h1>'+esc(a.t)+'</h1>'+(D.star?'<p class="eyebrow"><svg class="i sc" aria-hidden="true"><use href="#i-star"/></svg> نجمة جديدة</p>':'')+'<div class="card" style="width:100%">'+boardHTML()+'</div><button class="btn big" data-act="close">تم</button></div></div></div>';return;}
  var s=ss[D.i],nx=ss[D.i+1],key='st:'+D.actId+':'+D.i,stars='';
  for(var i=0;i<n;i++)stars+='<span class="st'+(D.marks[i]?' on':'')+(i===D.i?' cur':'')+'"'+(n>10?' style="width:18px;height:18px"':'')+'><svg class="i" aria-hidden="true"><use href="#i-star"/></svg></span>';
  layer.innerHTML='<div class="overlay" role="dialog" aria-label="خطوات '+esc(a.t)+'"><header>'+closeBtn()+'<div class="ft"><span class="mini">'+picHTML(a)+'</span><div class="stars" aria-label="الخطوة '+ar(D.i+1)+' من '+ar(n)+'">'+stars+'</div></div>'+PXH('brk')+(canEdit()&&!S.set.lock?'<button class="iconbtn" data-act="oedit" data-col="act" data-id="'+a.id+'" aria-label="تعديل النشاط"><svg class="i" aria-hidden="true"><use href="#i-edit"/></svg></button>':'')+'</header><div class="stage"><div class="inner">'+
    '<p class="eyebrow">'+esc(a.t)+(n>1?' · الخطوة '+ar(D.i+1)+' من '+ar(n):'')+'</p>'+PXH('stepVideo',s.id)+'<button class="pic" data-act="osay" data-id="'+s.id+'" aria-label="اسمع '+esc(s.t)+'">'+picHTML(s)+(D.flash?'<span class="star"><svg class="i" aria-hidden="true"><use href="#i-star"/></svg></span>':'')+'</button><div class="word">'+esc(s.t)+'</div>'+
    timerHTML(key,s.min||0)+'<button class="btn big done" data-act="sdone"><svg class="i" aria-hidden="true"><use href="#i-check"/></svg> '+(D.i+1<n?'تم':'خلّصت')+'</button>'+
    (nx?'<div class="then-row"><span class="eyebrow">ثم</span><span class="mini">'+picHTML(nx)+'</span><b class="grow">'+esc(nx.t)+'</b></div>':'')+(D.i>0?'<button class="btn small line" data-act="sprev">السابق</button>':'')+'</div></div></div>';
}
function stepDone(D){
  if(D.lock||D.done)return;D.lock=true;D.marks[D.i]=1;var a=libGet('act',D.actId);if(!a){D.lock=false;return;}var ss=actSteps(a);
  if(S.tm&&S.tm.key==='st:'+D.actId+':'+D.i){S.tm=null;saveLocal();}
  if(D.i+1>=ss.length){D.done=true;D.lock=false;if(D.itemId){markDone(D.itemId);var N=STACK[STACK.indexOf(D)-1];if(N&&N.type==='now')N.advance=true;}
    D.star=S.set.starsAct!==false;if(D.star)earn(1);D.draw();cheer();return;}
  D.flash=true;D.draw();setTimeout(function(){D.flash=false;D.lock=false;D.i++;if(TOP()===D)enterStep(D);},S.set.calm?300:900);
}

function onOField(inp){
  var E=TOP();if(!E||E.type!=='oedit')return;var o=oObj(E);if(!o)return;var k=inp.getAttribute('data-of'),v=inp.value.trim();
  if(k==='min'||k==='cost'){v=parseInt(v.replace(/[٠-٩]/g,function(c){return '٠١٢٣٤٥٦٧٨٩'.indexOf(c);}),10);if(isNaN(v))v=k==='cost'?5:0;v=Math.max(k==='cost'?1:0,Math.min(k==='cost'?50:600,v));}
  if(k==='t'&&!v){inp.value=o.t;return;}
  var p;
  if(E.sub>=0){var a=libGet('act',E.id),ss=clone(a.steps||[]);if(!ss[E.sub])return;if(v===''||(k==='min'&&!v))delete ss[E.sub][k];else ss[E.sub][k]=v;if(k==='e'&&v)ss[E.sub].nb=1;p=orgPatch('act',E.id,{steps:ss});}
  else{var q={};q[k]=v;if(k==='e'&&v)q.nb=1;p=orgPatch(E.col,E.id,q);}
  osave(p,'حُفظ');
}
function onPField(inp){
  var E=TOP();if(!E||E.type!=='pedit')return;var i=+inp.getAttribute('data-i'),k=inp.getAttribute('data-pf')||inp.getAttribute('data-mf'),v=inp.value.trim();
  if(k==='min'){v=parseInt(v.replace(/[٠-٩]/g,function(c){return '٠١٢٣٤٥٦٧٨٩'.indexOf(c);}),10);if(isNaN(v))v=0;v=Math.max(0,Math.min(600,v));}

}

/* weekly summary for the progress tab */
function orgWeek(){var from=addDays(today(),-6),done=0,tok=0,days={};Object.keys(S.days).forEach(function(k){var x=S.days[k];if(!x||!x.date||x.date<from||x.date>today())return;tok+=(x.c&&x.c.tok)||0;if(x.sd)for(var id in x.sd)if(x.sd[id]>0){done++;days[x.date]=1;}});
  return {done:done,tok:tok,days:Object.keys(days).length,rw:allHist().filter(function(h){return h.d>=from;})};}
function orgProgressCard(){var o=orgWeek();return '<div class="card"><h2>التنظيم الذاتي</h2><div class="tiles">'+st(ar(o.done),'نشاط أنجزه من الجدول')+st(ar(o.tok),'نجمة جمعها')+'</div>'+(o.rw.length?'<p><b>الجوائز:</b> '+o.rw.map(function(x){return esc(x.t+(x.ch?' ('+x.ch+')':''));}).join('، ')+'</p>':'<p class="muted">لم يستلم جائزة هذا الأسبوع.</p>')+'</div>';}

/* actions */
function orgClick(a,b,d,Tp){
  var x,p;
  switch(a){
  case 'nowopen':openNow(d('id'));return true;
  case 'astart':{var id=d('id'),pv=d('prev'),later=d('later')==='1';STACK.pop();if(pv&&!daySD(today())[pv])markDone(pv,false);openNow(id);if(later)return true;var it=null;todayItems().forEach(function(q){if(q.id===id)it=q;});if(it)enterItem(it,false);return true;}
  case 'adone':{var pid=d('id');if(pid&&!daySD(today())[pid])markDone(pid,false);STACK.pop();redraw();toast('أحسنت يا '+KN());return true;}
  case 'asnooze':{var A0=TOP();if(A0&&A0.type==='alert'){S.snooze={d:today(),at:Date.now()+5*MINMS,id:A0.it?A0.it.id:null,prev:A0.prev?A0.prev.id:null};saveLocal();STACK.pop();redraw();toast('أذكّرك بعد ٥ دقائق');}return true;}
  case 'oalarm':{var k=d('k');if(k){S.set.alarm=k;saveLocal();}stopAll();playUrl(alarmUrl(),false);redraw();return true;}
  case 'osay':{if(!say(d('id'))&&Tp&&Tp.type==='oedit')toast('لا يوجد تسجيل');return true;}
  case 'nstart':{var c=nowState().cur;if(c)enterItem(c,true);return true;}
  case 'ndone':if(Tp&&Tp.type==='now')nowDone(Tp,false);return true;
